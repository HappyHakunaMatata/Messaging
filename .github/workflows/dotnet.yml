# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    environment: production
    permissions: 
      contents: read
      id-token: write
      
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore ./Messaging.csproj
      
    - name: Build
      run: dotnet build ./Messaging.csproj -c Release --no-restore
      
    - name: Test
      run: dotnet test ./Messaging.csproj --no-build --verbosity normal
      
    - name: Pack
      run: dotnet pack ./Messaging.csproj -c Release --no-build -o ./packages
      
    - name: NuGet login 
      uses: NuGet/login@v1 
      id: login 
      with: 
        user: ${{ secrets.NUGET_USER }}

    - name: Publish
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        dotnet nuget push "./packages/*.nupkg" \
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
          --source "https://api.nuget.org/v3/index.json" \
          --skip-duplicate
